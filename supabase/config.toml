[auth]
# Email provider configuration for Auth
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = true
double_confirm_changes = true

[auth.sms]
enable_confirmations = false

[functions.get-turn]
verify_jwt = false

[functions.make-server-bca21fd3]
# This function serves both public and protected routes.
# Route-level auth is enforced inside the function itself, so disabling
# gateway JWT verification avoids browser preflight/sign-up failures.
verify_jwt = false
